<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Funderingskaart</title>
<meta name="description" content="De funderingen van Nederland in 3D: funderingstype, herstel, pandzakking en funderingsrisico per pand.">
<script>
  // the colour scheme before first paint (no flash): dark unless the visitor chose light (Yorick 2026-11-12)
  try {
    document.documentElement.dataset.theme = localStorage.getItem('fm-mode') === 'light' ? 'light' : 'dark';
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
